<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Lantern</title>
<meta name="theme-color" content="#05070d">
<meta name="description" content="Sunset scroll prototype for the robotlantern.com home page.">
<style>
  /* One number drives everything: --progress, 0 at the top of the page, 1 at the bottom. */
  :root {
    --progress: 0;
    --ink: #0a0e18;
    --night: #04060d;
    --lantern: #ffd28a;
    --sky-height: 500vh;
    --ground: 24px; /* solid strip under the treeline; iOS Safari samples its toolbar color here */
    background: var(--night);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: var(--sky-height);
    background: var(--night);
    color: #e9e2d2;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }

  /* The sky: one tall background that scrolls with the page.
     Zenith colors run from the reference photo's dusk blue down into night. */
  .sky {
    position: absolute;
    inset: 0 0 auto;
    height: var(--sky-height);
    background: linear-gradient(to bottom,
      #3c5b88 0%, #395785 8%, #2c4675 20%, #1d325a 34%,
      #132343 48%, #0c1730 62%, #080f21 76%, #050914 90%, var(--night) 100%);
  }
  /* Stars: RJ's night photo, contrast-enhanced, on a fixed layer that fades in over the
     sunset. Across the whole scroll it drifts up only 6vh, so the sky reads as still. */
  .stars {
    position: fixed;
    left: 0;
    right: 0;
    top: -30vh;
    height: 150vh;
    background: url(night.jpg) center 40% / cover no-repeat;
    opacity: calc((var(--progress) - .18) * 1.75);
    transform: translateY(calc(var(--progress) * -6vh));
    pointer-events: none;
  }
  /* Twinkle: three sparse layers of bright points pulsing on unrelated periods. */
  .twinkle {
    position: absolute;
    inset: 0;
    animation: twinkle var(--t) ease-in-out var(--d) infinite alternate;
  }
  .twinkle.a {
    --t: 2.9s; --d: 0s;
    background:
      radial-gradient(circle 1.6px at 14% 22%, #fff, transparent),
      radial-gradient(circle 1.3px at 61% 9%, #fff6e0, transparent),
      radial-gradient(circle 1.8px at 83% 64%, #fff, transparent),
      radial-gradient(circle 1.2px at 37% 78%, #e6eeff, transparent);
    background-size: 530px 610px;
  }
  .twinkle.b {
    --t: 4.3s; --d: -1.7s;
    background:
      radial-gradient(circle 1.4px at 27% 48%, #fff, transparent),
      radial-gradient(circle 1.9px at 72% 31%, #eef3ff, transparent),
      radial-gradient(circle 1.2px at 91% 86%, #fff, transparent);
    background-size: 670px 530px;
  }
  .twinkle.c {
    --t: 6.1s; --d: -3.2s;
    background:
      radial-gradient(circle 1.7px at 8% 70%, #fff8ea, transparent),
      radial-gradient(circle 1.3px at 49% 17%, #fff, transparent),
      radial-gradient(circle 1.5px at 66% 92%, #fff, transparent);
    background-size: 450px 740px;
  }
  @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }

  /* Fixed atmosphere: the warm horizon of the reference photo, then a dusky afterglow.
     Both follow --progress. */
  /* They stop just short of the bottom edge, so no orange touches it: iOS Safari tints its
     toolbar from whatever fixed layer meets the edge. */
  .horizon, .afterglow {
    position: fixed;
    inset: 0 0 var(--ground);
    pointer-events: none;
  }
  .horizon {
    background: linear-gradient(to top,
      #e58f57 0%, #eaa163 5%, #e7b981 12%, #e0c29d 18%,
      rgba(212,199,181,.72) 27%, rgba(160,184,200,.4) 40%, rgba(120,152,187,0) 58%);
    opacity: calc(1 - var(--progress) * 2.4);
  }
  .afterglow {
    background: linear-gradient(to top,
      rgba(168,86,78,.7) 0%, rgba(122,70,98,.45) 14%, rgba(70,56,104,.2) 30%, transparent 48%);
    opacity: min(calc(var(--progress) * 4.5), calc((.62 - var(--progress)) * 3));
  }
  .treeline {
    position: fixed;
    inset: auto 0 calc(var(--ground) - 4px);
    height: max(5.2vw, 56px);
    background: url(treeline.png) center bottom / auto 100% repeat-x;
    pointer-events: none;
  }
  .ground {
    position: fixed;
    inset: auto 0 0;
    height: var(--ground);
    background-color: #05070d;
  }
  .treeline::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: 100vh;
    background: #05070d;
  }

  /* The wordmark. Its period is the lantern. */
  .mark {
    position: fixed;
    left: 50%;
    top: 40%;
    width: min(78vw, 34rem);
    transform: translate(-50%, -50%);
  }
  .mark svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ink { fill: var(--ink); }
  .lit { opacity: calc((var(--progress) - .15) * 1.5); }
  .lit-dot { fill: var(--lantern); opacity: calc((var(--progress) - .08) * 1.4); }
  .core { fill: #fff6df; opacity: calc((var(--progress) - .35) * 1.6); }
  .halo {
    position: absolute;
    left: 96.27%;
    top: 91.98%;
    width: 170%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%) scale(calc(.55 + var(--progress) * .6));
    opacity: calc((var(--progress) - .1) * 1.2);
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .halo i {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,214,140,.75) 0, rgba(255,176,84,.32) 6%, rgba(255,150,64,.12) 20%,
      rgba(255,140,60,.04) 36%, transparent 55%);
    animation: flicker 7s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    23% { opacity: .9; }
    41% { opacity: .97; }
    58% { opacity: .86; }
    77% { opacity: .95; }
  }

  .hint, .nav {
    position: fixed;
    left: 0;
    right: 0;
    text-align: center;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-size: .75rem;
  }
  .hint {
    bottom: calc(max(5.2vw, 56px) + var(--ground) + 1rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .35rem;
    color: #2a1d18;
    opacity: calc(1 - var(--progress) * 16);
    pointer-events: none;
  }
  .hint svg { width: 1.4rem; height: auto; }
  .nav {
    top: calc(40% + min(78vw, 34rem) * .22 + 2.5rem);
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    opacity: calc((var(--progress) - .86) * 7.2);
    visibility: hidden;
  }
  .night .nav { visibility: visible; }
  .nav a { color: #eadcc0; text-decoration: none; padding: .5rem 0; }
  .nav a:hover, .nav a:focus-visible { color: var(--lantern); }

  @media (prefers-reduced-motion: reduce) {
    .twinkle { animation: none; opacity: .7; }
    .halo i { animation: none; }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true">
    <div class="twinkle a"></div>
    <div class="twinkle b"></div>
    <div class="twinkle c"></div>
  </div>
  <div class="horizon" aria-hidden="true"></div>
  <div class="afterglow" aria-hidden="true"></div>

  <h1 class="mark">
    <span class="halo" aria-hidden="true"><i></i></span>

        <radialGradient id="lanternlight" gradientUnits="userSpaceOnUse" cx="7294" cy="168" r="7000">
          <stop offset="0" stop-color="#ffd79a"/>
          <stop offset=".25" stop-color="#f6dbb0"/>
          <stop offset=".6" stop-color="#ddd5c4"/>
          <stop offset="1" stop-color="#b3bccf"/>
        </radialGradient>

        </g>
      </defs>
      <use href="#letters" class="ink"/>
      <use href="#letters" class="lit" fill="url(#lanternlight)"/>
      <circle class="ink" cx="729.4" cy="299.2" r="17.2"/>
      <circle class="lit-dot" cx="729.4" cy="299.2" r="17.2"/>
      <circle class="core" cx="729.4" cy="299.2" r="9"/>
    </svg>
  </h1>

  <div class="hint" aria-hidden="true">
    <span>Scroll down</span>
    <svg viewBox="0 0 24 20"><path d="M5 3l7 6 7-6M5 11l7 6 7-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <nav class="nav" aria-label="Main">
    <a href="#">Essays</a>
    <a href="#">Conversations</a>
    <a href="#">Shop</a>
  </nav>

  <div class="treeline" aria-hidden="true"></div>
  <div class="ground" aria-hidden="true"></div>

  <script>
    (() => {
      const r = document.documentElement;
      let queued = false;
      const update = () => {
        queued = false;
        const max = r.scrollHeight - innerHeight;
        const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 1;
        r.style.setProperty('--progress', p.toFixed(4));
        r.classList.toggle('night', p > .9);
      };
      addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
      addEventListener('resize', update);
      update();
    })();
  </script>
</body>
</html>
